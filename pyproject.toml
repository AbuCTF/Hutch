[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hutch"
version = "0.7.0"
description = "isolated playwright session orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "playwright>=1.40",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
stealth = ["playwright-stealth>=2.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=1.0"]
all = ["hutch[stealth,caido,mcp]"]

[project.scripts]
hutch = "hutch.cli:main"
hutch-mcp = "hutch.mcp:main"

[tool.setuptools.packages.find]
include = ["hutch*"]
