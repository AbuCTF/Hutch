[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hutch"
version = "0.1.0"
description = "isolated playwright session orchestrator"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
stealth = ["playwright-stealth>=2.0"]
caido = ["caido-py>=0.1"]
all = ["hutch[stealth,caido]"]

[project.scripts]
hutch = "hutch.cli:main"

[tool.setuptools.packages.find]
include = ["hutch*"]
